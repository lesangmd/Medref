name: Publish MedRef Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'medref-update.json'
      - '.github/workflows/publish-medref-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Read MedRef release manifest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.versionName' medref-update.json)"
          VERSION_CODE="$(jq -r '.versionCode' medref-update.json)"
          APK_SHA256="$(jq -r '.sha256' medref-update.json)"
          SOURCE_APK_URL="$(jq -r '.sourceDownloadUrl // empty' medref-update.json)"
          test -n "$VERSION"
          test "$VERSION" != "null"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" != "null"
          echo "$APK_SHA256" | grep -Eq '^[a-f0-9]{64}$'
          test -n "$SOURCE_APK_URL"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "APK_SHA256=$APK_SHA256" >> "$GITHUB_ENV"
          echo "SOURCE_APK_URL=$SOURCE_APK_URL" >> "$GITHUB_ENV"

      - name: Download production-signed APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          curl --fail --location --retry 3 --retry-delay 3 \
            --output "dist/MedRef-v${VERSION}.apk" "${SOURCE_APK_URL}"
          printf '%s  %s\n' "${APK_SHA256}" "dist/MedRef-v${VERSION}.apk" | sha256sum -c -
          cp "dist/MedRef-v${VERSION}.apk" "dist/MedRef-latest.apk"

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="medref-v${VERSION}"
          NOTES="MedRef Android v${VERSION} (versionCode ${VERSION_CODE}). Production-signed APK. SHA-256: ${APK_SHA256}"
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "MedRef Android v${VERSION}" --notes "${NOTES}" --latest
          else
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
              --title "MedRef Android v${VERSION}" --notes "${NOTES}" --latest
          fi
          gh release upload "${TAG}" \
            "dist/MedRef-v${VERSION}.apk#MedRef-v${VERSION}.apk" \
            "dist/MedRef-latest.apk#MedRef-latest.apk" \
            --repo "${GITHUB_REPOSITORY}" --clobber

      - name: Verify release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="medref-v${VERSION}"
          gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" \
            --json tagName,name,url,assets > release.json
          jq -e --arg v "MedRef-v${VERSION}.apk" --arg latest "MedRef-latest.apk" '
            .tagName == ("medref-v" + env.VERSION) and
            ([.assets[].name] | index($v) != null) and
            ([.assets[].name] | index($latest) != null)
          ' release.json >/dev/null
          cat release.json
